{{/* The Abdeen Labs lockup: the Key, a divider, and the wordmark. Every shell
     closes with it. */}}
{{define "lockup"}}<span class="lockup" role="img" aria-label="Abdeen Labs">
  <span class="seal-key" aria-hidden="true"><span class="seal-mark" lang="ar">عابدين</span></span>
  <span class="lockup-divider" aria-hidden="true"></span>
  <span class="wordmark" aria-hidden="true">Abdeen Labs</span>
</span>{{end}}
