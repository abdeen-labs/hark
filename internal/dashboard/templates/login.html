{{define "content"}}
<section class="gate">
  <div class="gate__brand">
    <p class="meta"><span class="idx">Hark</span> Push relay</p>
    <p class="display gate__title">Hark</p>
    <p class="lede">Receive push notifications and Live Activities from webhooks and API clients.</p>
  </div>

  <div class="gate__panel">
    <section class="module module--marked">
      <div class="module__head">
        <p class="module__label"><span class="module__index">Access</span></p>
      </div>
      <div class="module__body">
        <h1 class="h-ui">Sign in</h1>
        <form method="post" action="{{.Paths.Login}}" class="stack" hx-disabled-elt="find button[type=submit]">
          <input type="hidden" name="csrf_token" value="{{.CSRF}}">
          <input type="hidden" name="next" value="{{.Next}}">

          <label class="field">
            <span class="field__label">Username</span>
            <input class="input" type="text" name="username" value="{{.Username}}"
                   autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
          </label>

          <label class="field">
            <span class="field__label">Password</span>
            <input class="input" type="password" name="password" autocomplete="current-password" required>
          </label>

          <button class="btn btn--primary" type="submit">Sign in <span class="arrow">→</span></button>
        </form>
      </div>
    </section>
  </div>

  <footer class="gate__foot meta">
    <span class="lockup" role="img" aria-label="Abdeen Labs">
      <span class="seal-key" aria-hidden="true"><span class="seal-mark" lang="ar">عابدين</span></span>
      <span class="lockup-divider" aria-hidden="true"></span>
      <span class="wordmark" aria-hidden="true">Abdeen Labs</span>
    </span>
    <span>Hark{{if .Version}} · Rev {{.Version}}{{end}}</span>
  </footer>
</section>
{{end}}
