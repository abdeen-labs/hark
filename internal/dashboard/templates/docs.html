{{define "docs"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.Title}} · Hark</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ce2020'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="{{.Assets.CSS}}">
<link rel="stylesheet" href="{{.Assets.Docs}}">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="{{.Paths.Docs}}"><span class="brand__mark" aria-hidden="true"></span>Hark</a>
    <nav class="nav" aria-label="Sections">
      <a href="{{.Paths.Docs}}" aria-current="page">API</a>
      <a href="{{.Paths.Home}}">Dashboard</a>
    </nav>
  </div>
</header>

<div class="docs">
  <nav class="toc" aria-label="Contents">
    <p class="toc__title">Contents</p>
    <ul class="toc__list">
      {{range .Contents}}
      <li class="toc__item toc__item--h{{.Level}}"><a href="#{{.ID}}">{{.Text}}</a></li>
      {{end}}
    </ul>
  </nav>
  <article class="prose">{{.Body}}</article>
</div>

<footer class="footer">Hark{{if .Version}} · {{.Version}}{{end}}</footer>
</body>
</html>{{end}}
