{{define "content"}}
<section class="gate gate--error">
  <div class="gate__brand">
    <p class="meta"><span class="idx">Status</span> {{.Status}}</p>
    <p class="display gate__code num">{{.Status}}</p>
  </div>
  <div class="gate__panel">
    <h1 class="headline">{{.Title}}</h1>
    <p class="lede">{{.Message}}</p>
    <p><a class="btn" href="{{.Paths.Home}}"><span class="arrow arrow--back">←</span> Back to the dashboard</a></p>
  </div>
  <footer class="gate__foot meta">
    <span>Hark</span>
    {{if .Version}}<span>Rev {{.Version}}</span>{{end}}
  </footer>
</section>
{{end}}
