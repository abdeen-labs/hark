{{define "content"}}
<section class="gate gate--error">
  <div class="gate__brand">
    <p class="gate__eyebrow meta"><span class="brand__mark" aria-hidden="true"></span>Hark · Error</p>
    <p class="display gate__code num">{{.Status}}</p>
  </div>
  <div class="gate__panel">
    <h1 class="headline">{{.Title}}</h1>
    <p class="lede">{{.Message}}</p>
    <p><a class="btn btn--lg" href="{{.Paths.Home}}"><span class="arrow arrow--back" aria-hidden="true">←</span> Back to the dashboard</a></p>
  </div>
  <footer class="gate__foot meta">
    {{template "lockup"}}
    <span>Hark{{if .Version}} · Rev {{.Version}}{{end}}</span>
  </footer>
</section>
{{end}}
